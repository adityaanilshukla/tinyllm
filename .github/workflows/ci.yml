name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsentencepiece-dev \
            libabsl-dev \
            libgtest-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

# The CUDA kernels are verified by compiling and running them on real NVIDIA hardware
# (see cuda/README.md and the README). CI has no GPU runner, so it does not build or run
# the CUDA code; a GPU-less compile-only job added fragility (toolkit package availability)
# for little signal and is deliberately omitted.
