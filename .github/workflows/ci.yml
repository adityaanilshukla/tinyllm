name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsentencepiece-dev \
            libabsl-dev \
            libgtest-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  cuda-compile:
    name: CUDA kernels (compile-only, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CPU-side dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libsentencepiece-dev \
            libabsl-dev

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          method: network
          sub-packages: '["nvcc", "cudart"]'

      # No GPU runner is available, so CMAKE_CUDA_ARCHITECTURES is pinned explicitly
      # (the default in cuda/CMakeLists.txt is "native", which needs a GPU to probe).
      # Tests are off here: this job only compiles the CUDA kernels, it never runs them.
      - name: Configure (CUDA, compile-only)
        run: >
          cmake -S . -B build-cuda -G Ninja
          -DTINYLLM_CUDA=ON
          -DTINYLLM_BUILD_TESTS=OFF
          -DCMAKE_CUDA_ARCHITECTURES=89

      - name: Build CUDA kernels
        run: cmake --build build-cuda
