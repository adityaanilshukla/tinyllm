<!doctype html>
<!--
  Source for docs/architecture.png. Hand-drawn style via rough.js (the engine behind
  Excalidraw) with the Caveat handwriting font for titles. Regenerate:

    npm install roughjs @fontsource/caveat
    chromium --headless=new --allow-file-access-from-files --force-device-scale-factor=2 \
      --virtual-time-budget=6000 --screenshot=out.png --window-size=1240,700 \
      file://$PWD/architecture.html
    convert out.png -bordercolor white -border 20 -trim +repage \
      -bordercolor white -border 28 architecture.png
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Caveat'; font-weight:600;
    src:url('node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family:'Caveat'; font-weight:700;
    src:url('node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2') format('woff2'); }
  html,body { margin:0; padding:0; background:#ffffff; }
  svg { display:block; }
  text { font-family:'Liberation Sans','DejaVu Sans',sans-serif; fill:#1e293b; }
  .hand { font-family:'Caveat',cursive; }
  .mono { font-family:'DejaVu Sans Mono',monospace; }
</style>
<script src="node_modules/roughjs/bundled/rough.js"></script>
</head>
<body>
<svg id="d" width="1240" height="700" viewBox="0 0 1240 700" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const svg = document.getElementById('d');
const rc = rough.svg(svg);
const NS = 'http://www.w3.org/2000/svg';
let seed = 1;

function rr(x,y,w,h,r){
  return `M${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} `
       + `Q${x+w},${y+h} ${x+w-r},${y+h} L${x+r},${y+h} Q${x},${y+h} ${x},${y+h-r} `
       + `L${x},${y+r} Q${x},${y} ${x+r},${y} Z`;
}
function text(x,y,s,o={}){
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',x); t.setAttribute('y',y);
  t.setAttribute('text-anchor',o.anchor||'middle');
  t.setAttribute('font-size',o.size||14);
  if(o.weight) t.setAttribute('font-weight',o.weight);
  if(o.fill) t.setAttribute('fill',o.fill);
  if(o.cls) t.setAttribute('class',o.cls);
  t.textContent=s; svg.appendChild(t);
}
function box(x,y,w,h,title,subs,opt={}){
  const o=Object.assign({roughness:1.05,bowing:1.4,stroke:'#334155',strokeWidth:1.7,
    fill:'#f1f5f9',fillStyle:'solid',seed:seed++},opt.rough||{});
  svg.appendChild(rc.path(rr(x,y,w,h,12),o));
  const cx=x+w/2;
  const ty = subs&&subs.length ? y+36 : y+h/2+9;
  text(cx,ty,title,{size:opt.titleSize||26,cls:'hand',weight:700,fill:opt.titleFill||'#0f172a'});
  if(subs){ subs.forEach((s,i)=>{
    text(cx,ty+20+i*18,s.t,{size:13,cls:s.mono?'mono':'',fill:'#475569'});
  });}
}
function head(x1,y1,x2,y2,o){
  const a=Math.atan2(y2-y1,x2-x1), L=11, w=0.42;
  svg.appendChild(rc.line(x2,y2,x2-L*Math.cos(a-w),y2-L*Math.sin(a-w),o));
  svg.appendChild(rc.line(x2,y2,x2-L*Math.cos(a+w),y2-L*Math.sin(a+w),o));
}
function arrow(x1,y1,x2,y2){
  const o={roughness:1.1,stroke:'#475569',strokeWidth:1.7,seed:seed++};
  svg.appendChild(rc.line(x1,y1,x2,y2,o)); head(x1,y1,x2,y2,o);
}
function elbow(pts,dash){
  const o={roughness:1.0,stroke:'#475569',strokeWidth:1.7,seed:seed++};
  if(dash) o.strokeLineDash=[8,6];
  svg.appendChild(rc.linearPath(pts,o));
  const n=pts.length;
  head(pts[n-2][0],pts[n-2][1],pts[n-1][0],pts[n-1][1],o);
}

// ---- Title ----
text(40,52,'Convert once, then run the forward pass once per token',
  {anchor:'start',size:34,cls:'hand',weight:700,fill:'#0f172a'});

// ---- Band 1: once per model ----
text(40,96,'once per model',{anchor:'start',size:21,cls:'hand',fill:'#64748b'});
box(40,112,268,92,'HuggingFace folder',
  [{t:'config.json · model.safetensors'},{t:'vocab.json or tokenizer.model'}]);
box(486,112,268,92,'tinyllm-convert',
  [{t:'maps names, fixes layout'},{t:'bf16 → f32, optional q8 / q4'}]);
box(912,112,268,92,'model.tllm',
  [{t:'header + tensor index'},{t:'64-byte aligned weights'}]);
arrow(308,158,486,158);
arrow(754,158,912,158);

// ---- Band 2: once per token ----
text(40,250,'once per token',{anchor:'start',size:21,cls:'hand',fill:'#64748b'});
box(40,272,268,104,'Tokenizer',
  [{t:'GPT-2 BPE or SentencePiece'},{t:'prompt text → token ids'}]);
box(486,272,268,104,'forward(token, pos)',
  [{t:'GPT-2 or LLaMA layers'},{t:'one token at a time → logits'}],
  {rough:{stroke:'#2563eb',fill:'#dbeafe'},titleFill:'#1e40af'});
box(912,272,268,104,'Sampler',
  [{t:'temperature, top-k, top-p'},{t:'picks one token id'}]);
arrow(308,324,486,324); text(397,314,'ids',{size:13,fill:'#475569'});
arrow(754,324,912,324); text(833,314,'logits',{size:13,fill:'#475569'});

// weights drop from model.tllm into forward
elbow([[1046,204],[1046,238],[640,238],[640,272]]);
text(840,232,'weights, mmapped',{size:13,fill:'#475569'});

// sampler -> streamed text
arrow(1046,376,1046,452);
box(912,452,268,74,'Streamed text',[{t:'decode step, stops at EOS'}]);

// ---- Inside each layer group ----
const o={roughness:0.9,stroke:'#94a3b8',strokeWidth:1.3,fill:'#f8fafc',fillStyle:'solid',seed:seed++};
svg.appendChild(rc.path(rr(40,452,772,188,14),o));
text(64,484,'inside each layer',{anchor:'start',size:21,cls:'hand',fill:'#64748b'});
arrow(620,376,620,452); text(660,416,'each layer',{size:13,fill:'#475569'});
box(68,506,228,112,'linear()',
  [{t:'f32 matvec'},{t:'q8 / q4 int8 dot'}],{titleSize:24});
box(316,506,228,112,'attention()',
  [{t:'MHA or GQA'},{t:'over the KV cache'}],{titleSize:24});
box(564,506,228,112,'norms, RoPE',
  [{t:'LayerNorm, GELU'},{t:'RMSNorm, SwiGLU'}],{titleSize:24});

// CUDA kernels (dashed, off to the side)
box(912,560,268,100,'CUDA kernels',
  [{t:'tiled GEMM, fused attention,'},{t:'LayerNorm, softmax'},{t:'benchmarked vs cuBLAS'}],
  {rough:{stroke:'#15803d',fill:'#f0fdf4',strokeLineDash:[9,6]},titleFill:'#166534',titleSize:24});
elbow([[812,606],[912,606]],true);
</script>
</body>
</html>
